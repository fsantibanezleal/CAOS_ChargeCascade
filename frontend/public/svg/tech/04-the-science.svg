<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" class="arch-svg" role="img" aria-label="ChargeCascade science flow: validate, critical speed, per-shell departure, parabolic flight, regime, Hogg-Fuerstenau power">
  <!-- Hand-authored for ChargeCascade — the real algorithm, step by step with the genuine equations.
       Shell CSS-variable tokens only, so it stays themed (ADR-0058). -->
  <style>
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .mono { font-family: var(--font-mono, ui-monospace, Consolas, monospace); }
    .arch-svg .bx { fill: var(--color-surface-2); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .bx-hi { stroke: var(--color-accent); }
    .arch-svg .bx-good { stroke: var(--color-good); }
    .arch-svg .ttl { fill: var(--color-fg); font-size: 13px; font-weight: 700; }
    .arch-svg .sub { fill: var(--color-fg-subtle); font-size: 10px; }
    .arch-svg .it { fill: var(--color-fg); font-size: 11px; font-weight: 600; }
    .arch-svg .cd { fill: var(--color-accent); font-size: 9.5px; }
    .arch-svg .eq { fill: var(--color-fg); font-size: 11.5px; font-style: italic; }
    .arch-svg .mu { fill: var(--color-fg-subtle); font-size: 9.5px; }
    .arch-svg .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.6; }
    .arch-svg .cat { fill: none; stroke: var(--color-bad); stroke-width: 1.6; }
    .arch-svg .shell { fill: none; stroke: var(--color-fg-subtle); stroke-width: 1.3; }
  </style>
  <defs>
    <marker id="sc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-fg-faint)"/>
    </marker>
  </defs>

  <text class="ttl" x="22" y="30">The science / algorithm flow — exact analytic mill physics</text>
  <text class="sub" x="22" y="47">mill geometry + speed → critical speed → per-shell departure (Davis) → trajectories + regime → torque-arm power (Hogg–Fuerstenau)</text>

  <!-- Stage 1: validate -->
  <rect class="bx" x="16" y="70" width="158" height="92" rx="9"/>
  <text class="it" x="28" y="92">1 · Validate</text>
  <text class="mu" x="28" y="110">mill: type, D, L, J, ball d,</text>
  <text class="mu" x="28" y="124">φc, charge density</text>
  <text class="mu" x="28" y="140">range + honesty guards</text>
  <text class="cd mono" x="28" y="156">Contract 1</text>

  <!-- Stage 2: critical speed -->
  <rect class="bx bx-hi" x="190" y="70" width="168" height="92" rx="9"/>
  <text class="it" x="202" y="92">2 · Critical speed</text>
  <text class="eq" x="202" y="116">Nc = 42.3 / √(D − d)</text>
  <text class="eq" x="202" y="136">φc = N / Nc</text>
  <text class="mu" x="202" y="154">42.3 derived, not fitted (rpm, m)</text>

  <!-- Stage 3: per-shell departure -->
  <rect class="bx bx-hi" x="374" y="70" width="174" height="92" rx="9"/>
  <text class="it" x="386" y="92">3 · Departure (Davis)</text>
  <text class="eq" x="386" y="116">cos α = φc² · r / R</text>
  <text class="mu" x="386" y="134">the angle where a particle at</text>
  <text class="mu" x="386" y="148">radius r leaves the shell</text>

  <!-- Stage 4: parabolic flight + a little mill glyph -->
  <rect class="bx" x="564" y="70" width="158" height="92" rx="9"/>
  <text class="it" x="576" y="92">4 · Parabolic flight</text>
  <circle class="shell" cx="640" cy="128" r="24"/>
  <path class="cat" d="M620,120 C648,96 672,112 664,140"/>
  <text class="mu" x="576" y="156">free-fall cataract arc</text>

  <!-- Stage 5: regimes -->
  <rect class="bx" x="738" y="70" width="148" height="160" rx="9"/>
  <text class="it" x="750" y="92">5 · Regime (by φc)</text>
  <text class="mu" x="750" y="112">cascading — φc low</text>
  <text class="mu" x="750" y="128">(charge rolls / slumps)</text>
  <text class="mu" x="750" y="148">cataracting — mid φc</text>
  <text class="mu" x="750" y="164">(charge thrown, impacts toe)</text>
  <text class="mu" x="750" y="184">centrifuging — φc ≥ 1</text>
  <text class="mu" x="750" y="200">(pinned to shell, no grind)</text>
  <text class="cd mono" x="750" y="222">regime.ts</text>

  <!-- Stage 6: power (wide) -->
  <rect class="bx bx-good" x="16" y="206" width="706" height="98" rx="9"/>
  <text class="it" x="28" y="228">6 · Power draw — Hogg–Fuerstenau torque-arm model</text>
  <text class="eq" x="28" y="254">P = ω · M · g · (R_arm · sin θ)        with the fill term  J (1 − 1.065 J)  peaking near 45–50% fill</text>
  <text class="mu" x="28" y="276">M = charge mass, ω = mill angular speed, R_arm = torque-arm radius, θ = the shoulder angle; the Morrell C-model is the cross-check.</text>
  <text class="cd mono" x="28" y="294">power.ts · Hogg–Fuerstenau 1972 · Morrell 1996</text>

  <!-- Output -->
  <rect class="bx bx-good" x="16" y="328" width="866" height="60" rx="9"/>
  <text class="it" x="28" y="352">Output: power draw (MW) · the binding regime · toe/shoulder angles · the 3D cataract trajectories · the capacity readout — all live, all from the same exact engine.</text>
  <text class="mu" x="28" y="376">Controls: C-CRITICAL (φc ≥ 1 → charge centrifuges, grinding collapses) and C-EMPTY (J = 0 → no charge → no power) are exact analytic checks the engine must reproduce.</text>

  <!-- flows -->
  <path class="flow" d="M174,116 H188" marker-end="url(#sc-arrow)"/>
  <path class="flow" d="M358,116 H372" marker-end="url(#sc-arrow)"/>
  <path class="flow" d="M548,116 H562" marker-end="url(#sc-arrow)"/>
  <path class="flow" d="M722,116 H736" marker-end="url(#sc-arrow)"/>
  <path class="flow" d="M369,205 V172 a0,0 0 0,0 0,0" marker-end="url(#sc-arrow)"/>
  <text class="mu" x="300" y="200">→ trajectories + regime feed the power model</text>
</svg>
